# tools/ran.conf - editable knobs for the live 5G lab (sourced by tools/lab.sh,
# tools/setup_ran.sh and tools/lab_helpers.sh). This is DEMO/HARNESS config
# only. The router's own policy (rules, rate caps, quarantine) is edited live
# in the dashboard or with the control-pane verbs, not here.

# --- traffic generator (the ping in the 'traffic' pane) ---
# This LAN drops the VM's WiFi association when it sees ICMP to internet
# hosts - do NOT point this at 8.8.8.8 or similar. Default: the LAN gateway
# (auto-detected from the default route), which still exercises the full XDP
# data path (decap -> NAT -> egress -> reply -> NAT -> encap) without the
# traffic ever leaving the LAN. Keep the rate low regardless.
PING_TARGET="${PING_TARGET:-}"
if [ -z "$PING_TARGET" ]; then
  PING_TARGET=$(ip route show default 2>/dev/null | awk '{for(i=1;i<=NF;i++) if($i=="via"){print $(i+1); exit}}')
  PING_TARGET="${PING_TARGET:-127.0.0.1}"   # last resort: never an internet host
fi
PING_INTERVAL=1         # seconds between packets (1 pkt/s)
PING_SIZE=64            # ICMP payload bytes

# --- egress ---
# SINGLE SOURCE OF TRUTH for the internet-facing NIC. Leave empty to
# auto-detect from the default route (`ip route get 8.8.8.8`, dev field);
# set explicitly (or via env) only to pin a specific interface. NIC names
# differ per machine (eth0, enp0s3, ...) - never hardcode one elsewhere.
EGRESS_IFACE="${EGRESS_IFACE:-}"
if [ -z "$EGRESS_IFACE" ]; then
  EGRESS_IFACE=$(ip route get 8.8.8.8 2>/dev/null | sed -n 's/.* dev \([^ ]*\).*/\1/p' | head -1)
fi

# --- static 1:1 NAT (the XDP in-hook NAT for the live UE) ---
# Dedicated egress IP the UE's traffic is NATed to. Must be unused on the
# LAN and MUST be inside the egress subnet, or the gateway routes replies
# upstream instead of ARPing for it locally (a phone hotspot's /28 made a
# fixed ".73" silently dead). Leave empty to derive: the second-highest
# usable host of the egress subnet - above DHCP's sequential range, below
# the "last usable = infrastructure" convention. setup_ran.sh adds it as a
# secondary address on EGRESS_IFACE; the lab verbs pass the same value to
# add-teid --nat-ip / add-nat, so there is exactly one place this is defined.
NAT_IP="${NAT_IP:-}"
if [ -z "$NAT_IP" ] && [ -n "$EGRESS_IFACE" ]; then
  NAT_IP=$(ip -o -4 addr show dev "$EGRESS_IFACE" scope global 2>/dev/null \
           | awk '{print $4; exit}' \
           | python3 -c "import ipaddress,sys
cidr=sys.stdin.read().strip()
hosts=list(ipaddress.ip_interface(cidr).network.hosts())
print(hosts[-2] if len(hosts)>=2 else '')" 2>/dev/null)
fi

# --- optional policy applied automatically on launch (0 = leave unset) ---
DEFAULT_RATE_PPS=0          # e.g. 5 to cap the live subscriber at launch
DEFAULT_Q_THRESHOLD=0       # consecutive over-cap windows before quarantine
DEFAULT_Q_SECONDS=30        # quarantine hold duration
